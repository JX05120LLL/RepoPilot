name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 项目面向 Windows 10/11 本地桌面交付，CI 使用 Windows 运行器保持与开发环境一致。
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -t . -v

      - name: Check for whitespace errors
        run: git diff --check

      - name: Lint (advisory)
        continue-on-error: true
        run: uvx ruff check src tests

      - name: Format check (advisory)
        continue-on-error: true
        run: uvx ruff format --check src tests
